worker_processes auto;
events {}

http {
    ## -----------------------
    ## ★ Rate Limiting Zone 설정
    ## -----------------------
    # IP 기준으로 초당 5회 요청 제한 (버스팅 허용)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;

    server {
        listen 80;

        ## -----------------------
        ## ★ 공통 Proxy 헤더
        ## -----------------------
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        ## -----------------------
        ## ★ Response Header (게이트웨이 처리 여부 확인)
        ## -----------------------
        add_header X-Gateway-Processed "true";

        ## -----------------------
        ## ★ 요청 URL rewrite (API 버전 → 내부 경로)
        ##    /api/v1/user/info → /user/info
        ## -----------------------
        location /api/v1/user/ {
            rewrite ^/api/v1/user/(.*)$ /user/$1 break;
            proxy_pass http://user-service:8081/;
        }

        ## -----------------------
        ## ★ Service Routing
        ##    프론트 요청 경로와 별도 유지
        ## -----------------------
        location /api/user/ {
            proxy_pass http://user-service:8081/user/info;
        }

        location /api/order/ {
            proxy_pass http://order-service:8082/order/list;
        }

        ## -----------------------
        ## ★ Secure Endpoint (간단 인증)
        ##    Authorization 헤더 없으면 401
        ## -----------------------
        location /api/secure/user/ {
            if ($http_authorization = "") {
                return 401 "Unauthorized: Missing Token";
            }
            proxy_pass http://user-service:8081/user/info;
        }

        ## -----------------------
        ## ★ Rate Limiting 적용 구간
        ## -----------------------
        location /api/ {
            limit_req zone=api_limit burst=5;
            proxy_pass http://user-service:8081/;
        }
    }
}