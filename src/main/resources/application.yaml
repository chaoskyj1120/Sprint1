spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  profiles:
    active: local
  server:
    port: 8080
  application:
    name: discodeit
  boot:
    admin:
      client:
        instance:
          name: discodeit
  config:
    import: "optional:classpath:.env"

discodeit:
  storage:
    type: ${STORAGE_TYPE:s3}  # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage} #/uploads 가 기존 경로
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    javax.management.remote.rmi: info
    sun.rmi.transport.tcp: info

aws:
  region: ${AWS_S3_REGION}
  credentials:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}